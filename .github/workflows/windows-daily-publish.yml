name: Windows data daily publication
on:
  schedule:
    - cron: '50 21 * * *' # 06:50 JST
    - cron: '15,45 22 * * *' # 07:15 / 07:45 JST recovery checks
    - cron: '15 23 * * *' # 08:15 JST final check, still within normal product freshness
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gadget-production-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ vars.WINDOWS_PIPELINE_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.snapshot.outputs.source_commit }}
      publish: ${{ steps.gate.outputs.publish }}
      gate_status: ${{ steps.gate.outputs.gate_status }}
      gate_reason: ${{ steps.gate.outputs.gate_reason }}
      weekday_jst: ${{ steps.snapshot.outputs.weekday_jst }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - id: snapshot
        shell: bash
        run: |
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "weekday_jst=$(TZ=Asia/Tokyo date +%u)" >> "$GITHUB_OUTPUT"
      - id: gate
        name: Require current editorial and no successful publication today
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python -X utf8 scripts/publication_gate.py --root "$GITHUB_WORKSPACE" --site-only --scheduled-check
          else
            python -X utf8 scripts/publication_gate.py --root "$GITHUB_WORKSPACE" --site-only
          fi
      - id: prepare
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          python -X utf8 scripts/publication_pipeline.py prepare --purpose site --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/publication" --source-commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.gate.outputs.publish == 'true'
        with:
          name: validated-publication
          path: ${{ runner.temp }}/publication/bundle
          if-no-files-found: error
          retention-days: 2
  weekly-note:
    # Wait for deployment to finish before any note commit can advance main.
    # Its success is independent of Pages, and weekday publication needs no note.
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.gate_status != 'blocked' && needs.prepare.outputs.weekday_jst == '7' && vars.WINDOWS_PIPELINE_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Prepare strictly validated Sunday note materials
        shell: bash
        run: python -X utf8 scripts/publication_pipeline.py prepare --purpose note --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/weekly-note" --source-commit "$(git rev-parse HEAD)"
      - id: persist
        env:
          GADGET_PUBLICATION_ENABLED: '1'
        run: python -X utf8 scripts/publication_pipeline.py persist-note --purpose note --root "$GITHUB_WORKSPACE" --bundle "$RUNNER_TEMP/weekly-note/bundle" --apply
  deploy:
    if: ${{ needs.prepare.outputs.publish == 'true' && vars.WINDOWS_PIPELINE_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validated-publication
          path: ${{ runner.temp }}/publication
      - env:
          EXPECTED_MAIN: ${{ needs.prepare.outputs.source_commit }}
        run: python -X utf8 scripts/publication_pipeline.py verify-current --purpose site --root "$GITHUB_WORKSPACE" --bundle "$RUNNER_TEMP/publication" --expected-main "$EXPECTED_MAIN"
      - id: gate
        name: Recheck freshness and successful publication before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 scripts/publication_gate.py --root "$GITHUB_WORKSPACE" --site-only
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.gate.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.gate.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/publication/docs
      - name: Final artifact expiry and main check
        if: steps.gate.outputs.publish == 'true'
        env:
          EXPECTED_MAIN: ${{ needs.prepare.outputs.source_commit }}
        run: python -X utf8 scripts/publication_pipeline.py verify-current --purpose site --root "$GITHUB_WORKSPACE" --bundle "$RUNNER_TEMP/publication" --expected-main "$EXPECTED_MAIN"
      - id: deployment
        name: Publish Pages
        if: steps.gate.outputs.publish == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  report:
    if: ${{ always() && vars.WINDOWS_PIPELINE_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    needs: [prepare, weekly-note, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Summarize actual publication without claiming success on a skip
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          NOTE_RESULT: ${{ needs.weekly-note.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PUBLISH_NEEDED: ${{ needs.prepare.outputs.publish }}
          GATE_STATUS: ${{ needs.prepare.outputs.gate_status }}
          GATE_REASON: ${{ needs.prepare.outputs.gate_reason }}
        shell: bash
        run: |
          {
            echo '## Gadget daily publication evidence (not an automatic success claim)'
            echo "prepare=$PREPARE_RESULT gate=$GATE_STATUS reason=$GATE_REASON"
            echo "deploy=$DEPLOY_RESULT weekly_note=$NOTE_RESULT requested=$PUBLISH_NEEDED"
            if [ "$GATE_STATUS" = 'already_published' ]; then
              echo 'Already published: this gate observed a real earlier Publish Pages receipt.'
            elif [ "$GATE_STATUS" = 'blocked' ]; then
              echo 'BLOCKED: no Pages publication was attempted by this run.'
              echo 'A separate day-deduplicated issue alert follows after the recovery window.'
            elif [ "$PUBLISH_NEEDED" = 'true' ] && [ "$DEPLOY_RESULT" = 'success' ]; then
              echo 'Deploy job completed; verify the Publish Pages step for actual publication.'
            elif [ "$PUBLISH_NEEDED" = 'true' ]; then
              echo 'Publication not confirmed; needs review.'
            else
              echo 'No new publication requested; do not infer publication success.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GATE_STATUS" = blocked ] || [ "$PREPARE_RESULT" = failure ] ||
             { [ "$PUBLISH_NEEDED" = true ] && [ "$DEPLOY_RESULT" != success ]; } ||
             [ "$NOTE_RESULT" = failure ] || [ "$NOTE_RESULT" = cancelled ]; then
            echo '::warning::Gadget publication needs review. A separate scheduled issue alert is deduplicated by JST date.'
          fi
  alert:
    # One failure email / issue per JST day, not four failures from the
    # scheduled backup runs. Missing/unknown publication is NEVER "published".
    if: ${{ always() && github.event_name == 'schedule' && vars.WINDOWS_PIPELINE_ENABLED == 'true' && github.ref == 'refs/heads/main' && (needs.prepare.result == 'failure' || needs.prepare.result == 'cancelled' || needs.prepare.outputs.gate_status == 'blocked' || (needs.prepare.outputs.publish == 'true' && needs.deploy.result != 'success') || needs.weekly-note.result == 'failure' || needs.weekly-note.result == 'cancelled') }}
    needs: [prepare, weekly-note, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Report one actual daily failure without attempting Pages or note
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          NOTE_RESULT: ${{ needs.weekly-note.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PUBLISH_NEEDED: ${{ needs.prepare.outputs.publish }}
          GATE_STATUS: ${{ needs.prepare.outputs.gate_status }}
          GATE_REASON: ${{ needs.prepare.outputs.gate_reason }}
        run: python -X utf8 scripts/publication_daily_alert.py
