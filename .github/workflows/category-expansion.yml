name: Gradually expand gadget categories
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/category_rollout.py'
      - 'scripts/test_category_rollout.py'
      - 'config/category-expansion.json'
      - 'data/category-expansion-state.json'
      - '.github/workflows/category-expansion.yml'
  schedule:
    # Saturday JST staging after the 06:10 fixed-IP collector, ahead of
    # Sunday's collection. Three independent opportunities tolerate a
    # significantly delayed GitHub scheduler (safe window Sat 15:00-Sun 05:45).
    - cron: '15 6 * * 6'   # Saturday 15:15 JST
    - cron: '15 10 * * 6'  # Saturday 19:15 JST
    - cron: '15 18 * * 6'  # Sunday 03:15 JST

permissions:
  contents: write

concurrency:
  group: noranamani-gadget-category-rollout
  cancel-in-progress: false

jobs:
  validate-and-rollout:
    if: github.ref == 'refs/heads/main' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source, config and rollout journal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline category rollout tests
        run: python -m unittest discover -s scripts -p test_category_rollout.py -v
      - name: Show dry-run decision (NO Rakuten API calls)
        run: python scripts/category_rollout.py --check
      - id: write_window
        name: Check safe Saturday-to-Sunday category staging window
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: python scripts/category_rollout.py --apply-window-status
      - name: Add at most ONE vetted root category for the coming Sunday
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.write_window.outputs.open == 'true'
        env:
          CATEGORY_ROLLOUT_SCHEDULED: '1'
        run: python scripts/category_rollout.py --apply
      - name: Validate category JSON and persist both category config and rollout journal
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.write_window.outputs.open == 'true'
        run: |
          set -eu
          python -m json.tool config/queries.json >/dev/null
          python -m json.tool data/category-expansion-state.json >/dev/null
          python -m unittest discover -s scripts -p test_category_rollout.py -v
          git diff --check
          git add -- config/queries.json data/category-expansion-state.json
          if git diff --cached --quiet; then
            echo 'No new category this week (cooldown, insufficient products or limit).'
          else
            # A delayed Sunday job must not change queries after collection starts.
            python scripts/category_rollout.py --assert-apply-window
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
            python scripts/category_rollout.py --assert-apply-window
            git config user.name 'gadget-category-bot'
            git config user.email 'gadget-category-bot@users.noreply.github.com'
            git commit -m 'feat: gradually add one vetted gadget product category'
            timeout 90s git push origin HEAD:main
          fi
      - name: Operational note
        if: always()
        env:
          WRITE_WINDOW: ${{ steps.write_window.outputs.open }}
        run: |
          echo '### Gradual root category expansion' >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$WRITE_WINDOW" = false ]; then
            echo 'SAFE SKIP: GitHub cron arrived outside the Saturday 15:00-Sunday 05:45 JST write window; no category was added.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Max one category per 14 days (Sunday issue date), earliest 2026-11-01, up to 16 total categories.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Rakuten API calls; Windows collector reads approved queries at 06:10 JST.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A sparse/uncollected prior category pauses future additions instead of expanding blindly.' >> "$GITHUB_STEP_SUMMARY"
