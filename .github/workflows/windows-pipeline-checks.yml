name: Windows pipeline offline checks
on:
  push:
    branches: [feature/windows-data-pipeline]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -X utf8 -m unittest discover -s scripts -p "test_*.py" -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
