name: Windows pipeline offline checks
on:
  push:
    branches: [feature/windows-data-pipeline]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
  actions: read
# This workflow is read-only CI: only the latest commit for each PR/branch
# needs testing. Superseded revisions can stop to reduce redundant
# GitHub Actions failure/cancellation noise; production workflows are unchanged.
concurrency:
  group: gadget-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Build real product snapshot and audit GA4 before tomorrow's publication
        # Read-only CI: checkout workspace changes are discarded; do not call
        # Rakuten, GitHub Pages, note.com, or any production endpoint.
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -X utf8 scripts/build_site.py
          python -X utf8 scripts/validate.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -X utf8 -m unittest discover -s scripts -p "test_*.py" -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Observe live free-tool pages (read-only; pending never claims a deploy)
        if: matrix.os == 'ubuntu-latest'
        run: python -X utf8 scripts/check_live_tools.py --observe
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Verify the actual pinned Pages archive can be restored without a deploy
        if: matrix.os == 'ubuntu-latest' && github.head_ref == 'fix/recover-free-tools-from-last-published-20261120'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44405513424 \
            --repo "$GITHUB_REPOSITORY" \
            --name validated-publication \
            --dir "$RUNNER_TEMP/recovery-source"
          python -X utf8 scripts/recover_static_tool_pages.py \
            --artifact "$RUNNER_TEMP/recovery-source" \
            --output "$RUNNER_TEMP/recovered/docs"
          test -s "$RUNNER_TEMP/recovered/docs/sim-optimizer.html"
          test -s "$RUNNER_TEMP/recovered/docs/product-selector.html"
